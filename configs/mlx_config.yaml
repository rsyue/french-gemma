model_id: "google/gemma-3-270m-it"
dataset_path: "wikipedia"
dataset_name: "20220301.fr"
device: "mps"
max_sequence_length: 512
batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_steps: 100
max_steps: 5000
compile: false
